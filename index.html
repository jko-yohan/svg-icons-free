<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4754582635962628" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free SVG Icons - Open Source Icon Library for Developers</title>
    <meta name="description" content="200+ free SVG icons for developers and designers. Copy SVG code or download. No signup required. UI, arrows, social media, navigation and more.">
    <meta name="keywords" content="free svg icons, svg icon library, open source icons, developer icons, ui icons svg">
    <meta property="og:title" content="Free SVG Icons - Open Source Icon Library">
    <meta property="og:description" content="200+ free SVG icons. Copy or download instantly.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jko-yohan.github.io/svg-icons-free/">
    <link rel="canonical" href="https://jko-yohan.github.io/svg-icons-free/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Free SVG <span>Icons</span></h1>
            <p class="tagline">200+ open source icons. Copy SVG code or download. No signup required.</p>
            <div class="search-box">
                <input type="text" id="search" placeholder="Search icons..." oninput="filterIcons()">
            </div>
        </div>
    </header>

    <nav class="cat-nav">
        <div class="container">
            <a href="icons/ui.html" class="cat-link">UI Essentials</a>
            <a href="icons/arrows.html" class="cat-link">Arrows</a>
            <a href="icons/social.html" class="cat-link">Social Media</a>
            <a href="icons/navigation.html" class="cat-link">Navigation</a>
            <a href="icons/media.html" class="cat-link">Media</a>
            <a href="icons/file.html" class="cat-link">Files</a>
            <a href="icons/communication.html" class="cat-link">Communication</a>
            <a href="icons/commerce.html" class="cat-link">Commerce</a>
            <a href="icons/weather.html" class="cat-link">Weather</a>
            <a href="icons/misc.html" class="cat-link">Misc</a>
        </div>
    </nav>

    <main class="container">
        <section class="icon-grid" id="icon-grid">
        </section>

        <div class="ad-slot">
            <div class="ad-placeholder"><p>Advertisement</p></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Free SVG Icons. All icons are free to use in personal and commercial projects. MIT License.</p>
        </div>
    </footer>

    <div id="toast" class="toast"></div>
    <div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-preview" id="modal-preview"></div>
            <div class="modal-name" id="modal-name"></div>
            <div class="modal-actions">
                <button onclick="copySVG()">Copy SVG Code</button>
                <button onclick="downloadSVG()" class="secondary">Download SVG</button>
            </div>
            <pre class="modal-code" id="modal-code"></pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
